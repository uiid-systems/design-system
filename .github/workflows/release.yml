name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.PAT_TOKEN }}

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this job's OIDC token for a
      # short-lived publish token, so there is no long-lived secret to expire.
      # Each @uiid/* package must list this workflow as a trusted publisher.
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trusted publishing needs npm CLI >= 11.5.1. pnpm 10 publishes by
      # shelling out to the npm on PATH, and Node 24 bundles npm 11.
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # No dependency cache here: a cache any PR run can write must never feed
      # the job that holds the publish token.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Packages only. The tag already exists by now, so a failure in an app
      # that is never published must not stop the publish.
      - name: Build
        run: pnpm turbo run build --filter='./packages/*'

      - name: Check built packages
        run: node scripts/check-dist.mjs

      # The same check as the release PR's preflight. A package CI cannot
      # publish would 404 partway through and strand every package after it.
      - name: Check npm publishing
        run: node scripts/check-npm-publishing.mjs

      # Provenance is attached automatically when publishing via OIDC.
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks
