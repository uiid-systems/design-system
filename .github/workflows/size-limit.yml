name: Size Limit

on:
  # No `branches` filter: stacked PRs target an intermediate branch, not main.
  # `labeled`/`unlabeled` re-evaluate the `size-increase-ok` override, and
  # `ready_for_review` runs the check that a draft skipped.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checks out the PR merged into its base, so the difference from the
      # base commit is exactly what this PR adds.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit is checked out as a worktree below

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both builds share this cache, so the base build is mostly cache hits.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Measure PR
        run: |
          pnpm turbo build --filter='./packages/*'
          pnpm size-limit --json > size-head.json

      # The base is measured with the PR's config (via SIZE_ROOT), so both
      # sides are measured the same way even when the config itself changes.
      # HEAD is the merge commit, so its first parent is the base it merged onto.
      - name: Measure base
        run: |
          git worktree add --detach ../size-base "$(git rev-parse HEAD^1)"
          (cd ../size-base \
            && pnpm install --frozen-lockfile \
            && pnpm turbo build --filter='./packages/*' --cache-dir="$GITHUB_WORKSPACE/.turbo/cache")
          SIZE_ROOT=../size-base pnpm size-limit --json > size-base.json

      - name: Compare
        id: compare
        run: |
          set +e
          node scripts/size-compare.mjs size-base.json size-head.json --out size-report.md
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "grew=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Comment results on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('size-report.md', 'utf8');
            const marker = '### Size report';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on unapproved growth
        if: steps.compare.outputs.grew == 'true' && !contains(github.event.pull_request.labels.*.name, 'size-increase-ok')
        run: |
          echo "::error::An entry grew past the threshold. See the size report comment, or add the size-increase-ok label if the growth is intended."
          exit 1
