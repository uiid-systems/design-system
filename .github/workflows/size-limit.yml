name: Size Limit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  size:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need history for [origin/main] filter

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cache turbo outputs across runs so unchanged packages skip rebuild.
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build affected size-limit config
        id: affected
        run: |
          # Names of packages changed vs origin/main, including their dependents.
          NAMES=$(pnpm m ls --filter '...[origin/main]' --depth=-1 --json \
            | jq -r '.[].name' \
            | grep -v '^@uiid/design-system$' || true)
          # Keep only entries that exist in .size-limit.json (mcp, tokens, apps are skipped).
          jq --argjson names "$(echo "$NAMES" | jq -R . | jq -s .)" \
            '[.[] | select(.name as $n | $names | index($n))]' \
            .size-limit.json > .size-limit.filtered.json
          COUNT=$(jq 'length' .size-limit.filtered.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No measured packages affected — size check skipped."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Measuring $COUNT package(s):"
            jq -r '.[].name' .size-limit.filtered.json
          fi

      - name: Build affected packages
        if: steps.affected.outputs.skip != 'true'
        run: pnpm turbo build --filter='...[origin/main]'

      - name: Run size-limit for affected packages
        if: steps.affected.outputs.skip != 'true'
        run: pnpm size-limit --config .size-limit.filtered.json --json > size-report.json && cat size-report.json

      - name: Comment results on PR
        if: steps.affected.outputs.skip != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('size-report.json', 'utf8'));
            const fmt = (b) => `${(b / 1024).toFixed(2)} kB`;
            const rows = results.map(r => {
              const status = r.passed === false ? ':red_circle:' : ':white_check_mark:';
              return `| ${status} | \`${r.name}\` | ${fmt(r.size)} | ${r.limit ?? '—'} |`;
            });
            const body = [
              '### Size report (affected packages)',
              '',
              '| | Package | Size | Limit |',
              '|---|---|---|---|',
              ...rows,
              '',
              `_Checked ${results.length} affected package(s). Unchanged packages were not rebuilt._`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '### Size report (affected packages)';
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
