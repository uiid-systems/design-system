name: PR Title

on:
  # No `branches` filter: stacked PRs target an intermediate branch, not main,
  # and main's ruleset still requires this check on them.
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest
    # Release PRs from release-please manage their own title format — skip them
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            chore
            test
            ci
          requireScope: false
