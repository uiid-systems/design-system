name: Test

on:
  # No `branches` filter: stacked PRs target an intermediate branch, not main,
  # and must still be tested before they merge.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v2-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Packages, stories and the docs app, resolved from source, before any
      # build. It emits the per-icon modules and Next's route types itself.
      # Test files are included, which covers what Vitest cannot: expectTypeOf
      # is a no-op at runtime, so a drifted AI SDK union in @uiid/ai fails here.
      - name: Typecheck
        run: pnpm typecheck

      - name: Check generated props.css
        run: pnpm generate:props --check

      # Reads only the token JSON, so it needs no build.
      - name: Check palette contrast
        run: node scripts/check-palette-contrast.mjs

      # The new-package checklist steps that fail silently when skipped.
      - name: Check package registration
        run: node scripts/check-package-registration.mjs

      # Vitest's global setup generates the token CSS and the per-icon modules,
      # which install skipped, so this needs no build and no generate step.
      - name: Run tests
        run: pnpm test:run

      # The build below reuses this cache. Its key is separate from the Size
      # job's, so the two never race to save the same entry.
      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-

      # Each package still builds with `tsc -b` against its siblings' dist, so
      # this repeats the typecheck above the way the published declarations
      # see it.
      - name: Build packages
        run: pnpm turbo run build --filter='./packages/*'

      # Tests, Storybook and the typecheck resolve @uiid/* to source through the
      # `@uiid/source` export condition. This is the only step that loads the
      # built packages.
      - name: Check built packages
        run: node scripts/check-dist.mjs

      # Storybook's main.ts generates the token CSS and the per-icon modules
      # itself and resolves @uiid/* to source, so these tests need no build.
      - name: Install Playwright Chromium
        run: pnpm --filter @uiid/storybook exec playwright install --with-deps chromium

      # Runs every story's play function and a11y check in Chromium. Its Vite
      # cache is deliberately not cached, so a cold-cache regression (UI-403)
      # fails here instead of hiding behind a warm cache.
      - name: Run Storybook play and a11y tests
        timeout-minutes: 10
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1
        run: pnpm --filter @uiid/storybook exec vitest run

      # The *.browser.test.tsx files, in the Chromium installed above. They
      # resolve @uiid/* to source like the happy-dom tests, so need no build.
      - name: Run browser tests
        timeout-minutes: 5
        run: pnpm test:run --config vitest.browser.config.ts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: lint-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v2-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run linting
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check
