name: Test

on:
  # No `branches` filter: stacked PRs target an intermediate branch, not main,
  # and must still be tested before they merge.
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v2-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate tokens
        run: node packages/tokens/build-tokens.js

      - name: Check generated props.css
        run: pnpm generate:props --check

      # Reads only the token JSON, so it needs no build.
      - name: Check palette contrast
        run: node scripts/check-palette-contrast.mjs

      - name: Run tests
        run: pnpm test:run

      # The build below reuses this cache. Its key is separate from the Size
      # job's, so the two never race to save the same entry.
      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-

      # Each package builds with `tsc -b`, and its tsconfig includes its tests
      # (icons and design-system exclude theirs), so this build is the
      # typecheck for every package. Turbo builds siblings
      # first, which is what lets tsc resolve @uiid/* types from their dist.
      # It also covers what Vitest cannot: expectTypeOf is a no-op at runtime,
      # so a drifted AI SDK union in @uiid/ai fails here and nowhere else.
      - name: Build and typecheck packages
        run: pnpm turbo run build --filter='./packages/*'

      # @uiid/tokens builds without tsc.
      - name: Typecheck @uiid/tokens
        run: pnpm exec tsc --noEmit -p packages/tokens

      # Tests and Storybook alias @uiid/* to source. This is the only step
      # that loads the built packages.
      - name: Check built packages
        run: node scripts/check-dist.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: lint-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v2-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run linting
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check
